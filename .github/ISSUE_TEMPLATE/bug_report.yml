name: Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Steps to trigger the bug, plus the prompt you gave the agent if relevant.
      placeholder: |
        1. Install the plugin
        2. Ask the agent to ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead.
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: macOS version, Apple Silicon vs Intel, DeepSeek Harness version, model, and any relevant crash log.
      placeholder: |
        - macOS 15.x, Apple Silicon
        - DeepSeek Harness 0.2.0-rc.2
        - model: deepseek-flash
    validations:
      required: true
