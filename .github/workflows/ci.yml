name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Syntax check
        run: node --check index.js

      - name: Validate package.json
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version) throw new Error('missing name/version'); console.log('package.json ok:', p.name, p.version)"
